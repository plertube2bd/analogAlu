plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }

repositories {
    // GeckoLib, for the BOSS Mode bosses: a copy laid out in libs/maven builds offline; its own maven serves everyone else.
    maven {
        name = 'LocalGeckoLib'
        url = uri('libs/maven')
        content { includeGroup('com.geckolib') }
    }
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('com.geckolib') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ uses Loom non-remapping mode: use standard Gradle configurations.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Carried inside the jar, so players do not need to install GeckoLib themselves (MIT licence).
    implementation "com.geckolib:geckolib-fabric-26.3:${project.geckolib_version}"
    include "com.geckolib:geckolib-fabric-26.3:${project.geckolib_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'redstone_transportation_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// Keep a convenient copy at the project root as well as Gradle's standard build/libs output.
tasks.register('copyJarToLibs', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('libs'))
    rename { "${project.archives_base_name}-${project.version}.jar" }
}

tasks.named('build') {
    finalizedBy(tasks.named('copyJarToLibs'))
}
